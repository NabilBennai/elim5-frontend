<div class="flex items-center justify-center">
  <div class="card w-full max-w-md bg-base-200 shadow-xl">
    <div class="card-body">
      <h2 class="card-title text-2xl justify-center mb-4">Login</h2>

      @if (error) {
        <div class="alert alert-error text-sm">{{ error }}</div>
      }

      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
        <div class="form-group">
          <label class="label label-text" for="email">Email</label>
          <input
            id="email"
            type="email"
            formControlName="email"
            class="input input-bordered w-full"
            placeholder="you@example.com"
          />
          @if (form.controls.email.touched && form.controls.email.errors) {
            <span class="label-text-alt text-error">Valid email is required</span>
          }
        </div>

        <div class="form-group">
          <label class="label label-text" for="password">Password</label>
          <input
            id="password"
            type="password"
            formControlName="password"
            class="input input-bordered w-full"
            placeholder="********"
          />
          @if (form.controls.password.touched && form.controls.password.errors) {
            <span class="label-text-alt text-error">Password is required</span>
          }
        </div>

        <button type="submit" class="btn btn-primary w-full" [disabled]="form.invalid">
          Login
        </button>
      </form>

      <p class="text-center text-sm mt-4">
        Don't have an account?
        <a routerLink="/register" class="link link-primary">Register</a>
      </p>
    </div>
  </div>
</div>
