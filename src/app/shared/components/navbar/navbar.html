<nav class="navbar rounded-box shadow-base-300/20 shadow-sm">
  <div class="w-full md:flex md:items-center md:gap-2">
    <div class="flex items-center justify-between">
      <div class="navbar-start items-center justify-between max-md:w-full">
        <a class="link text-base-content link-neutral text-xl font-bold no-underline" routerLink="/"
          >ELIM5</a
        >
        <div class="md:hidden">
          <button
            type="button"
            class="collapse-toggle btn btn-outline btn-secondary btn-sm btn-square"
            data-collapse="#default-navbar-collapse"
            aria-controls="default-navbar-collapse"
            aria-label="Language"
          >
            <span class="icon-[tabler--menu-2] collapse-open:hidden size-4"></span>
            <span class="icon-[tabler--x] collapse-open:block hidden size-4"></span>
          </button>
        </div>
      </div>
    </div>
    <div
      id="default-navbar-collapse"
      class="md:navbar-end collapse hidden grow basis-full overflow-hidden transition-[height] duration-300 max-md:w-full"
    >
      <ul class="menu md:menu-horizontal items-center gap-2 p-0 text-base max-md:mt-2">
        <li>
          <a routerLink="/">{{ 'nav.home' | t }}</a>
        </li>
        <li>
          <select
            class="select select-bordered select-sm lang-select"
            [value]="i18n.language()"
            (change)="changeLanguage($any($event.target).value)"
            [attr.aria-label]="'nav.lang' | t"
          >
            @for (lang of languages; track lang.code) {
              <option [value]="lang.code">{{ lang.flag }} {{ lang.labelKey | t }}</option>
            }
          </select>
        </li>
        @if (auth.isLoggedIn()) {
          <li>
            <span class="text-base-content/60">{{ auth.user()?.email }}</span>
          </li>
          <li>
            <button (click)="logout()" class="btn btn-outline btn-error btn-sm">
              {{ 'nav.logout' | t }}
            </button>
          </li>
        } @else {
          <li>
            <a routerLink="/login">{{ 'nav.login' | t }}</a>
          </li>
          <li>
            <a routerLink="/register">{{ 'nav.register' | t }}</a>
          </li>
        }
      </ul>
    </div>
  </div>
</nav>
